<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷你商城 · React 练习</title>
  </head>
  <body>
    <!--
      💬 面试说：这个文件是整个应用的"空壳"。React 不负责它，
      它只提供一个挂载点。关键就下面两行：
      1) <div id="root"> —— 空的容器，页面内容全部由 JS 渲染进去；
      2) <script src="/src/main.jsx"> —— 应用的启动入口，
         浏览器下载这个 JS 后开始执行，React 应用从这里"出生"。
      （面试官问"项目是怎么跑起来的"，指着这两行讲。）
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
